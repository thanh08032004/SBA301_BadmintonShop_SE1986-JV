# Render cap cong qua bien PORT; chay may thi 8081
server.port=${PORT:8081}
spring.application.name=fastship-carrier-service

# MongoDB: may = Mongo local; deploy = MongoDB Atlas (dat MONGODB_URI tren Render, KHONG ghi vao file nay)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fastship_db}
# ten database, dung ca khi URI Atlas khong ghi ten db sau dau /
spring.data.mongodb.database=${MONGODB_DATABASE:fastship_db}
spring.data.mongodb.auto-index-creation=true

# Khoa API cap cho Badminton Shop (header X-Api-Key). Deploy: dat FASTSHIP_API_KEY ngau nhien, trung ben shop.
fastship.api-key=${FASTSHIP_API_KEY:dev-fastship-key}
# Ma shop duoc gan cho khoa tren (moi shop 1 khoa)
fastship.shop-code=badminton-shop

# Link tra cuu cong khai (FE partner). Deploy: https://<app>.vercel.app/track
tracking.portal.url=${FASTSHIP_PORTAL_URL:http://localhost:8082/track}

# Domain FE duoc goi API (cach nhau dau phay). Deploy: https://<app>.vercel.app,http://localhost:8082
fastship.cors-origins=${CORS_ORIGINS:*}

# Nap 2 van don mau FS-882910, FS-449102 khi collection con trong
fastship.seed-demo=${FASTSHIP_SEED_DEMO:true}
