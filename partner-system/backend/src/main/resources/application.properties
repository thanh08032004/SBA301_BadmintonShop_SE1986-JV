server.port=8081
spring.application.name=fastship-carrier-service

# MS SQL Server DataSource Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=fastship_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Shop & Carrier URLs
shop.webhook.url=http://localhost:8080/api/deliveries/webhook
tracking.portal.url=http://localhost:8082/track
