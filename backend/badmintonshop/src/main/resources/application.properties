spring.application.name=badmintonshop
server.port=8080
shop.frontend-url=${SHOP_FRONTEND_URL:http://localhost:5173}
fastship.api-url=${FASTSHIP_API_URL:http://localhost:8081}
# khoa goi API FastShip (header X-Api-Key), phai trung fastship.api-key ben partner-system
fastship.api-key=${FASTSHIP_API_KEY:dev-fastship-key}
# cho FastShip tren Render (goi Free) thuc day
fastship.timeout-seconds=${FASTSHIP_TIMEOUT_SECONDS:60}
# khoa ky webhook FastShip -> shop (header X-FastShip-Signature), phai trung fastship.webhook.secret ben partner-system
fastship.webhook-secret=${FASTSHIP_WEBHOOK_SECRET:dev-webhook-secret}
# job dong bo dinh ky van don chua ket thuc (luoi an toan khi webhook bi mat), mac dinh 5 phut
fastship.sync-job.enabled=${FASTSHIP_SYNC_JOB_ENABLED:true}
fastship.sync-job.interval-ms=${FASTSHIP_SYNC_INTERVAL_MS:300000}

# =====================================================================
# Database Configuration (SQL Server)
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=badminton_shop;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
# Flyway owns schema changes. Existing databases must be baselined explicitly.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=dbo
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# =====================================================================
# JWT Security Configuration
# =====================================================================
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64}
app.jwt.access-token-ttl-seconds=${APP_JWT_TTL_SECONDS:900}
app.jwt.cookie-name=${APP_JWT_COOKIE_NAME:ACCESS_TOKEN}
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=${APP_JWT_COOKIE_SAME_SITE:Lax}

# =====================================================================
# payOS Payment Gateway & Webhook Configuration
# =====================================================================
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# =====================================================================
# Google Mail SMTP
# =====================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.auth.reset-token-ttl-minutes=${APP_AUTH_RESET_TOKEN_TTL_MINUTES:15}


app.jwt.refresh-token-ttl-seconds=${APP_REFRESH_TOKEN_TTL_SECONDS:604800}
